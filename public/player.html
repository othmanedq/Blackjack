<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#0b2818" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cpath fill='%23d4af37' d='M12 2.6C9 6.7 4.4 9.2 4.4 13.3a4.6 4.6 0 0 0 6.7 4.1c-.3 1.8-1.2 2.9-2.6 3.6h7c-1.4-.7-2.3-1.8-2.6-3.6a4.6 4.6 0 0 0 6.7-4.1c0-4.1-4.6-6.6-7.6-10.7z'/%3E%3C/svg%3E" />
  <title>Blackjack Royale — Joueur</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;800&family=Inter:wght@400;600;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/shared.css" />
  <link rel="stylesheet" href="/css/player.css" />
</head>
<body>
  <!-- ================== ÉCRAN LOBBY ================== -->
  <section class="screen" id="screen-lobby">
    <h1 class="display"><span class="gold-text">Blackjack Royale</span></h1>
    <p class="subtitle">Rejoins la table</p>
    <form id="join-form">
      <label class="field-label" for="name-input">Ton pseudo</label>
      <input id="name-input" type="text" maxlength="16" placeholder="Ex. As de Pique" autocomplete="nickname" required />

      <label class="field-label">Ton avatar</label>
      <div class="picker" id="avatar-picker"></div>

      <label class="field-label">Ta couleur</label>
      <div class="picker" id="color-picker"></div>

      <button type="submit" class="cta big" id="join-btn">
        <i data-icon="play"></i> Prendre place
      </button>
      <p class="form-error" id="join-error"></p>
    </form>
  </section>

  <!-- Reprise de partie détectée depuis la même adresse réseau -->
  <div class="modal-overlay" id="resume-modal" hidden>
    <div class="modal-card">
      <h2 class="display gold-text"><i data-icon="eye"></i> On dirait toi</h2>
      <p class="modal-text">Un joueur avec cet appareil s'était déconnecté sans quitter la table :</p>
      <div class="resume-identity">
        <span class="resume-avatar" id="resume-avatar"></span>
        <span class="resume-name" id="resume-name"></span>
        <span class="resume-balance"><i data-icon="chip"></i> <span id="resume-balance">0</span></span>
      </div>
      <div class="modal-actions">
        <button type="button" class="cta" id="resume-yes">Reprendre cette partie</button>
        <button type="button" class="ghost-btn" id="resume-no">Non, nouveau joueur</button>
      </div>
    </div>
  </div>

  <!-- ================== ÉCRAN JEU ================== -->
  <section class="screen game" id="screen-game" hidden>
    <header class="game-head">
      <span class="me-avatar" id="me-avatar"></span>
      <span class="me-name">
        <i class="chef-crown" id="me-crown" data-icon="crown" hidden></i>
        <span id="me-name-text"></span>
      </span>
      <span class="me-balance"><i data-icon="chip"></i> <span id="me-balance">0</span></span>
    </header>

    <div class="status-line">
      <span class="badge waiting" id="me-status">En attente</span>
      <div class="timerbar" id="me-timer" hidden><i></i></div>
    </div>

    <main class="game-scroll">
    <!-- Configuration de la partie (avant la première manche, réglée par le chef) -->
    <div class="panel" id="config-panel" hidden>
      <p class="panel-title">Mode de jeu</p>
      <div class="mode-row" id="mode-options">
        <button type="button" class="mode-btn" data-mode="table">
          <span class="mode-icon"><i data-icon="monitor"></i></span>
          <span class="mode-label">Tous sur un écran</span>
          <span class="mode-sub">Un ordinateur affiche la table</span>
        </button>
        <button type="button" class="mode-btn" data-mode="phones">
          <span class="mode-icon"><i data-icon="phone"></i></span>
          <span class="mode-label">Chacun son écran</span>
          <span class="mode-sub">Chaque téléphone affiche tout</span>
        </button>
        <button type="button" class="mode-btn" data-mode="both">
          <span class="mode-icon"><i data-icon="both"></i></span>
          <span class="mode-label">Les deux</span>
          <span class="mode-sub">Écran commun + téléphones complets</span>
        </button>
      </div>

      <p class="panel-title">Cave de départ — pour tous les joueurs</p>
      <div class="stake-row" id="stake-options"></div>
      <p class="config-hint" id="config-hint"></p>
    </div>

    <!-- Re-cave : demande d'un joueur à sec + vote des autres -->
    <div class="panel rebuy" id="rebuy-panel" hidden>
      <p class="panel-title"><i data-icon="chipPlus"></i> Re-cave</p>
      <div id="rebuy-body"></div>
    </div>

    <!-- Zone mise -->
    <div class="panel" id="bet-panel" hidden>
      <p class="panel-title">Place ta mise</p>
      <div class="bet-amount display" id="bet-amount">0</div>
      <div class="chip-row">
        <button class="chip c10" data-chip="10">10</button>
        <button class="chip c25" data-chip="25">25</button>
        <button class="chip c50" data-chip="50">50</button>
        <button class="chip c100" data-chip="100">100</button>
        <button class="chip c500" data-chip="500">500</button>
      </div>
      <div class="bet-actions">
        <button class="ghost-btn" id="bet-clear">Effacer</button>
        <button class="ghost-btn allin-btn" id="bet-allin">
          <i data-icon="allIn"></i> <span id="bet-allin-label">All-in</span>
        </button>
        <button class="cta" id="bet-confirm" disabled>Miser</button>
      </div>
    </div>

    <!-- Assurance (le croupier montre un As) -->
    <div class="panel insurance" id="insurance-panel" hidden>
      <p class="panel-title"><i data-icon="shield"></i> Le croupier montre un As</p>
      <p class="insurance-text" id="insurance-text"></p>
      <div class="insurance-actions" id="insurance-actions">
        <button type="button" class="ghost-btn" id="insurance-no">Non merci</button>
        <button type="button" class="cta" id="insurance-yes">Assurer</button>
      </div>
      <div class="timerbar" id="insurance-timer"><i></i></div>
    </div>

    <!-- Mains du joueur -->
    <div class="panel my-hands" id="hands-panel" hidden>
      <div id="my-hands"></div>
    </div>

    <!-- La table : croupier + mains des autres joueurs (mode chacun son écran) -->
    <div class="panel table-panel" id="table-panel" hidden>
      <button type="button" class="table-toggle" id="table-toggle">
        <span><i data-icon="spade"></i> La table</span><span class="caret" id="table-caret">▾</span>
      </button>
      <div id="table-body">
        <div class="t-dealer" id="t-dealer" hidden>
          <div class="t-head">
            <span class="t-name"><i data-icon="cards"></i> Croupier</span>
            <span class="total-pill" id="t-dealer-total">?</span>
          </div>
          <div class="hand mini" id="t-dealer-hand"></div>
        </div>
        <div id="t-others"></div>
      </div>
    </div>

    <!-- Actions sur la table : don de jetons, exclusion (chef de table) -->
    <div class="table-actions" id="table-actions" hidden>
      <button type="button" class="ghost-btn" id="give-btn">
        <i data-icon="gift"></i> Donner des jetons
      </button>
      <button type="button" class="ghost-btn danger" id="kick-btn" hidden>
        <i data-icon="userX"></i> Exclure un joueur
      </button>
    </div>

    <!-- Message central (résultat / attente) -->
    <div class="center-msg" id="center-msg"></div>

    <!-- Chef de table : lance les manches depuis le téléphone -->
    <button class="cta big" id="phone-start" hidden>
      <i data-icon="play"></i> <span id="phone-start-label">Lancer la manche</span>
    </button>
    </main>

    <!-- Boutons d'action -->
    <p class="preset-hint" id="preset-hint" hidden></p>
    <footer class="actions" id="actions">
      <button class="action-btn hit" data-action="hit">
        <span class="action-icon"><i data-icon="hit"></i></span> Hit
      </button>
      <button class="action-btn stand" data-action="stand">
        <span class="action-icon"><i data-icon="stand"></i></span> Stand
      </button>
      <button class="action-btn double" data-action="double">
        <span class="action-icon"><i data-icon="double"></i></span> Double
      </button>
      <button class="action-btn split" data-action="split">
        <span class="action-icon"><i data-icon="split"></i></span> Split
      </button>
    </footer>
  </section>

  <!-- Sélection d'un joueur : don de jetons ou exclusion -->
  <div class="modal-overlay" id="pm-modal" hidden>
    <div class="modal-card">
      <h2 class="display gold-text" id="pm-title">Donner des jetons</h2>
      <p class="modal-text" id="pm-hint"></p>
      <div class="pm-list" id="pm-list"></div>
      <div id="pm-amount-box" hidden>
        <div class="bet-amount display" id="pm-amount">0</div>
        <div class="chip-row">
          <button type="button" class="chip c10" data-pm-chip="10">10</button>
          <button type="button" class="chip c25" data-pm-chip="25">25</button>
          <button type="button" class="chip c50" data-pm-chip="50">50</button>
          <button type="button" class="chip c100" data-pm-chip="100">100</button>
          <button type="button" class="chip c500" data-pm-chip="500">500</button>
        </div>
        <div class="pm-amount-actions">
          <button type="button" class="ghost-btn" id="pm-clear">Effacer</button>
          <button type="button" class="ghost-btn" id="pm-all">Tout donner</button>
        </div>
      </div>
      <div class="modal-actions">
        <button type="button" class="cta" id="pm-confirm" disabled>Confirmer</button>
        <button type="button" class="ghost-btn" id="pm-cancel">Annuler</button>
      </div>
    </div>
  </div>

  <div class="toast" id="toast" hidden></div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="/js/icons.js"></script>
  <script src="/js/shared.js"></script>
  <script src="/js/player.js"></script>
</body>
</html>
