<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cpath fill='%23d4af37' d='M12 2.2L19.8 12 12 21.8 4.2 12z'/%3E%3C/svg%3E" />
  <title>Poker Royale — Table</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;800&family=Inter:wght@400;600;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/shared.css" />
  <link rel="stylesheet" href="/css/poker-table.css" />
  <link rel="stylesheet" href="/css/host.css" />
</head>
<body>
  <header class="topbar">
    <h1 class="logo">
      <i class="suits red" data-icon="diamond"></i>
      <span class="gold-text">Poker Royale</span>
      <i class="suits" data-icon="club"></i>
    </h1>
    <div class="topbar-right">
      <span class="meta" id="hand-meta">Main —</span>
      <span class="meta" id="blinds-meta">Blindes —</span>
      <button class="icon-btn" id="rules-btn" title="Classement des mains" aria-label="Classement des mains">?</button>
      <button class="icon-btn" id="mute-btn" title="Son" aria-label="Couper le son">
        <i data-icon="soundOn" id="mute-icon"></i>
      </button>
    </div>
  </header>

  <!-- La table de poker (dessinée par js/poker-table.js) -->
  <main class="room" id="table"></main>

  <aside class="join-panel" id="join-panel">
    <h2 class="display gold-text">Rejoindre le poker</h2>
    <p class="join-hint">Scannez avec votre téléphone<br /><small>(même réseau Wi-Fi)</small></p>
    <div class="qr-frame"><img id="qr-img" alt="QR code pour rejoindre la table de poker" /></div>
    <code class="join-url" id="join-url">http://…</code>
    <div class="stake-box" id="config-box" hidden>
      <label for="stack-select">Tapis de départ (tous)</label>
      <select id="stack-select">
        <option value="500">500 jetons</option>
        <option value="1000">1 000 jetons</option>
        <option value="2000">2 000 jetons</option>
        <option value="5000">5 000 jetons</option>
        <option value="10000">10 000 jetons</option>
      </select>
      <label for="mode-select">Évolution des blindes</label>
      <select id="mode-select"></select>
    </div>
    <button class="cta" id="start-btn" disabled>
      <i data-icon="play"></i> <span id="start-label">Lancer la partie</span>
    </button>
    <button class="ghost-btn" id="collapse-btn">Réduire</button>
  </aside>

  <button class="fab" id="expand-btn" hidden>
    <i data-icon="qr"></i> Rejoindre la table
  </button>

  <!-- Classement des mains -->
  <div class="rules-overlay" id="rules" hidden>
    <div class="rules-card">
      <button class="icon-btn rules-close" id="rules-close" aria-label="Fermer">✕</button>
      <h2 class="display gold-text">Classement des mains</h2>
      <div id="rules-body"></div>
    </div>
  </div>

  <div class="chat-feed" id="chat-feed" aria-live="polite"></div>
  <div class="toast" id="toast" hidden></div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="/js/icons.js"></script>
  <script src="/js/shared.js"></script>
  <script src="/js/poker-table.js"></script>
  <script src="/js/poker-host.js"></script>
</body>
</html>
