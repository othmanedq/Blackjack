<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>♠</text></svg>" />
  <title>Blackjack Royale — Table</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;800&family=Inter:wght@400;600;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/shared.css" />
  <link rel="stylesheet" href="/css/host.css" />
</head>
<body>
  <header class="topbar">
    <h1 class="logo"><span class="suits">♠</span> <span class="gold-text">Blackjack Royale</span> <span class="suits red">♥</span></h1>
    <div class="topbar-right">
      <span class="meta" id="round-meta">Manche —</span>
      <span class="meta" id="shoe-meta">Sabot : —</span>
      <button class="icon-btn" id="mute-btn" title="Son">🔊</button>
    </div>
  </header>

  <main class="table" id="table">
    <!-- Zone croupier -->
    <section class="dealer-zone" id="dealer-zone">
      <div class="dealer-title">
        <span class="display gold-text">Croupier</span>
        <span class="total-pill" id="dealer-total" hidden>0</span>
        <span class="badge" id="dealer-badge" hidden></span>
      </div>
      <div class="hand dealer-hand" id="dealer-hand"></div>
    </section>

    <!-- Bandeau de phase / timer -->
    <section class="phase-strip">
      <div class="phase-msg" id="phase-msg">En attente de joueurs…</div>
      <div class="timerbar phase-timer" id="phase-timer" hidden><i></i></div>
    </section>

    <!-- Sièges joueurs -->
    <section class="seats" id="seats"></section>
  </main>

  <!-- Panneau latéral : rejoindre la partie -->
  <aside class="join-panel" id="join-panel">
    <h2 class="display gold-text">Rejoindre la table</h2>
    <p class="join-hint">Scannez avec votre téléphone<br /><small>(même réseau Wi-Fi)</small></p>
    <div class="qr-frame"><img id="qr-img" alt="QR code pour rejoindre" /></div>
    <code class="join-url" id="join-url">http://…</code>
    <button class="cta" id="start-btn" disabled>Lancer la manche</button>
    <button class="ghost-btn" id="collapse-btn">Réduire ⌃</button>
  </aside>

  <button class="fab" id="expand-btn" hidden>📱 Rejoindre / Nouvelle manche</button>

  <script src="/socket.io/socket.io.js"></script>
  <script src="/js/shared.js"></script>
  <script src="/js/host.js"></script>
</body>
</html>
