<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cpath fill='%23d4af37' d='M12 2.6C9 6.7 4.4 9.2 4.4 13.3a4.6 4.6 0 0 0 6.7 4.1c-.3 1.8-1.2 2.9-2.6 3.6h7c-1.4-.7-2.3-1.8-2.6-3.6a4.6 4.6 0 0 0 6.7-4.1c0-4.1-4.6-6.6-7.6-10.7z'/%3E%3C/svg%3E" />
  <title>Blackjack Royale — Table</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;800&family=Inter:wght@400;600;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/shared.css" />
  <link rel="stylesheet" href="/css/host.css" />
</head>
<body>
  <header class="topbar">
    <h1 class="logo">
      <i class="suits" data-icon="spade"></i>
      <span class="gold-text">Blackjack Royale</span>
      <i class="suits red" data-icon="heart"></i>
    </h1>
    <div class="topbar-right">
      <span class="meta" id="round-meta">Manche —</span>
      <span class="meta" id="shoe-meta">Sabot : —</span>
      <button class="icon-btn" id="mute-btn" title="Son" aria-label="Couper le son">
        <i data-icon="soundOn" id="mute-icon"></i>
      </button>
    </div>
  </header>

  <main class="table" id="table">
    <!-- Zone croupier -->
    <section class="dealer-zone" id="dealer-zone">
      <div class="dealer-title">
        <span class="display gold-text">Croupier</span>
        <span class="total-pill" id="dealer-total" hidden>0</span>
        <span class="badge" id="dealer-badge" hidden></span>
      </div>
      <div class="hand dealer-hand" id="dealer-hand"></div>
    </section>

    <!-- Bandeau de phase / timer -->
    <section class="phase-strip">
      <div class="phase-msg" id="phase-msg">En attente de joueurs…</div>
      <div class="timerbar phase-timer" id="phase-timer" hidden><i></i></div>
    </section>

    <!-- Sièges joueurs -->
    <section class="seats" id="seats"></section>
  </main>

  <!-- Panneau latéral : rejoindre la partie -->
  <aside class="join-panel" id="join-panel">
    <h2 class="display gold-text">Rejoindre la table</h2>
    <p class="join-hint">Scannez avec votre téléphone<br /><small>(même réseau Wi-Fi)</small></p>
    <div class="qr-frame"><img id="qr-img" alt="QR code pour rejoindre" /></div>
    <code class="join-url" id="join-url">http://…</code>
    <div class="mode-box" id="mode-box" hidden>
      <label>Mode de jeu</label>
      <div class="mode-row" id="host-mode-options">
        <button type="button" class="mode-btn" data-mode="table">
          <span class="mode-icon"><i data-icon="monitor"></i></span><span class="mode-label">Un écran</span>
        </button>
        <button type="button" class="mode-btn" data-mode="phones">
          <span class="mode-icon"><i data-icon="phone"></i></span><span class="mode-label">Chacun le sien</span>
        </button>
        <button type="button" class="mode-btn" data-mode="both">
          <span class="mode-icon"><i data-icon="both"></i></span><span class="mode-label">Les deux</span>
        </button>
      </div>
    </div>
    <div class="stake-box" id="stake-box" hidden>
      <label for="stake-select">Cave de départ (tous)</label>
      <select id="stake-select">
        <option value="100">100 jetons</option>
        <option value="500">500 jetons</option>
        <option value="1000">1 000 jetons</option>
        <option value="2000">2 000 jetons</option>
        <option value="5000">5 000 jetons</option>
        <option value="10000">10 000 jetons</option>
      </select>
    </div>
    <button class="cta" id="start-btn" disabled>
      <i data-icon="play"></i> <span id="start-btn-label">Lancer la manche</span>
    </button>
    <button class="ghost-btn" id="collapse-btn">Réduire</button>
  </aside>

  <button class="fab" id="expand-btn" hidden>
    <i data-icon="qr"></i> Rejoindre / Nouvelle manche
  </button>

  <div class="toast" id="toast" hidden></div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="/js/icons.js"></script>
  <script src="/js/shared.js"></script>
  <script src="/js/host.js"></script>
</body>
</html>
